<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>LisGo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./wasm_exec.js?v=2"></script>
    <script src="./demo.js?v=2"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/monaco-editor@latest/min/vs/editor/editor.main.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@latest/min/vs/loader.js"></script>
  </head>
  <body>
    <div id="container">
      <div id="editor"></div>
      <div id="panel">
        <div id="actions">
          <button id="execute">RUN</button>
        </div>
        <div id="scroll">
          <ul id="output"></ul>
        </div>
      </div>
      <script>
        // init web assembly
        async function initLisGo() {
          const go = new Go();
          result = await WebAssembly.instantiateStreaming(
            fetch(`lisgo.wasm?v2`),
            go.importObject
          );
          go.run(result.instance);
          await WebAssembly.instantiate(result.module, go.importObject);
          document.getElementById("execute").removeAttribute("disabled");
        }

        initLisGo();

        // init Monaco editor
        require.config({
          paths: {
            vs: "https://cdn.jsdelivr.net/npm/monaco-editor@latest/min/vs",
          },
        });

        let editor;
        require(["vs/editor/editor.main"], function () {
          editor = monaco.editor.create(document.getElementById("editor"), {
            value: demo,
            language: "scheme",
            theme: "vs-dark",
            fontSize: 14,
            minimap: { enabled: false },
            scrollBeyondLastLine: false,
          });
        });

        // execute code
        document.getElementById("execute").addEventListener("click", () => {
          document.getElementById("output").innerHTML = "";
          const source = editor.getValue();
          const result = lisgo(source);
          console.log(`Program end:\n ${new Date().toJSON()}`);
        });

        // inject console.log listener
        const output = document.getElementById("output");
        const log = console.log;
        console.log = function (v) {
          log(v);
          const node = document.createElement("li");
          node.append(document.createTextNode(v));
          output.append(node);
        };
      </script>
    </div>
  </body>
</html>
